# Render Blueprint — backend FastAPI (plan gratuito).
# Render → New → Blueprint → elija este repositorio.
services:
  - type: web
    name: aurora-ix-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r server/requirements.txt
    startCommand: cd server && uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ALLOWED_ORIGINS        # su dominio de Vercel, p. ej. https://aurora-ix.vercel.app
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: NTFY_TOPIC             # opcional: tema de ntfy para las alertas
        sync: false
      - key: TELEGRAM_TOKEN         # opcional
        sync: false
      - key: TELEGRAM_CHAT_ID       # opcional
        sync: false
